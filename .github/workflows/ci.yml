name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # mlac/ is dependency-light (numpy + pandas). Keep CI fast; it does NOT install
        # the heavy serving stack (fastapi/sklearn/catboost) — those are covered by the
        # golden snapshot run in the deploy environment, not unit CI.
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==3.0.3 pytest==8.3.3 ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check mlac tools tests || true   # advisory for now; tighten later

      - name: Unit tests
        run: pytest
